services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codevera
      POSTGRES_USER: codevera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codevera -d codevera"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
